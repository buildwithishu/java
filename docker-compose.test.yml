services:
  postgres-test:
    image: postgres:16-alpine
    container_name: event-portal-postgres-test
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: event_portal_test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d event_portal_test_db"]
      interval: 5s
      timeout: 5s
      retries: 10
