name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: event_portal_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d event_portal_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_DB_URL: jdbc:postgresql://localhost:5432/event_portal_db
      APP_DB_USER: postgres
      APP_DB_PASSWORD: postgres123

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialize database
        run: |
          psql -h localhost -U "$APP_DB_USER" -d event_portal_db -f sql/schema.sql
          psql -h localhost -U "$APP_DB_USER" -d event_portal_db -f sql/seed.sql
        env:
          PGPASSWORD: postgres123

      - name: Compile
        run: mvn -B clean compile

      - name: Test
        run: mvn -B test -P headless

      - name: Package
        run: mvn -B package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: college-event-portal-jar
          path: target/*.jar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
